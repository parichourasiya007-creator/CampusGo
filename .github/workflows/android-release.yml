name: CampusGo Automated Android APK Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build Native Android APK & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Copy Built APK Artifact
        run: |
          mkdir -p build-outputs
          cp android/app/build/outputs/apk/debug/app-debug.apk build-outputs/CampusGo-v1.0.0.apk || cp android/app/build/outputs/apk/*/*.apk build-outputs/CampusGo-v1.0.0.apk
          ls -la build-outputs/


      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "CampusGo Native Android App v1.0.${{ github.run_number }}"
          body: |
            ## 🚌 CampusGo Native Android App Release (v1.0.${{ github.run_number }})
            **Dr. Harisingh Gour Vishwavidyalaya (DHSGSU), Sagar, MP**

            ### 🚀 Features Included:
            - **Native Kotlin + Jetpack Compose UI**
            - **Real GPS Telemetry & Android Foreground Service (`BusTrackingForegroundService`)**
            - **Google Maps Compose Integration & Live Vehicle Marker (`🚌 BUS-01`)**
            - **Find My Bus Destination & ETA Calculator**
            - **Conductor 1-Handed Cockpit & Privacy-Guaranteed Telemetry**
            - **Node.js + Socket.IO + MongoDB Backend Integration**

            ### 📥 Download APK
            Download `CampusGo-v1.0.0.apk` below and install directly on your Android device.
          files: build-outputs/CampusGo-v1.0.0.apk
          make_latest: "true"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}






