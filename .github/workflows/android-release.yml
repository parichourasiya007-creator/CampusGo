name: CampusGo Automated Android APK Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build Native Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          chmod +x android/gradlew || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        run: |
          cd android
          gradle assembleDebug --no-daemon

      - name: Rename APK Output
        run: |
          mkdir -p build-outputs
          cp android/app/build/outputs/apk/debug/app-debug.apk build-outputs/CampusGo-v1.0.0.apk || cp android/app/build/outputs/apk/debug/*.apk build-outputs/CampusGo-v1.0.0.apk

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v1.0.0"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag_name }}
          name: "CampusGo Native Android App ${{ steps.release_tag.outputs.tag_name }}"
          body: |
            ## 🚌 CampusGo Native Android App Release (${{ steps.release_tag.outputs.tag_name }})
            **Dr. Harisingh Gour Vishwavidyalaya (DHSGSU), Sagar, MP**

            ### 🚀 Features Included:
            - **Native Kotlin + Jetpack Compose UI**
            - **Real GPS Telemetry & Android Foreground Service (`BusTrackingForegroundService`)**
            - **Google Maps Compose Integration & Live Vehicle Marker (`🚌 BUS-01`)**
            - **Find My Bus Destination & ETA Calculator**
            - **Conductor 1-Handed Cockpit & Privacy-Guaranteed Telemetry**
            - **Node.js + Socket.IO + MongoDB Backend Integration**

            ### 📥 Download APK
            Download the attached `CampusGo-v1.0.0.apk` below and install it directly on your Android device.
          files: |
            build-outputs/CampusGo-v1.0.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
