name: CampusGo Automated Android APK Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build Native Android APK & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publish Error Log to Summary
        if: failure()
        run: |
          echo "## ❌ Build Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 android/build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "CampusGo Native Android App v1.0.${{ github.run_number }}"
          body: |
            ## 🚌 CampusGo Native Android App Release (v1.0.${{ github.run_number }})
            **Dr. Harisingh Gour Vishwavidyalaya (DHSGSU), Sagar, MP**

            ### 🚀 Features Included:
            - **Native Kotlin + Jetpack Compose UI**
            - **Real GPS Telemetry & Android Foreground Service (`BusTrackingForegroundService`)**
            - **Google Maps Compose Integration & Live Vehicle Marker (`🚌 BUS-01`)**
            - **Find My Bus Destination & ETA Calculator**
            - **Conductor 1-Handed Cockpit & Privacy-Guaranteed Telemetry**
            - **Node.js + Socket.IO + MongoDB Backend Integration**

            ### 📥 Download APK
            Download `app-debug.apk` below and install directly on your Android device.
          files: |
            android/app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true

          make_latest: "true"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}





